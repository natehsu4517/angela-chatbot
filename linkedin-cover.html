<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Angela AI - LinkedIn Cover</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #f5f5f5;
    font-family: system-ui, sans-serif;
  }
  .wrapper {
    width: 1200px;
    height: 628px;
    background: #ECEAE6;
    position: relative;
    overflow: hidden;
  }
  .content {
    position: absolute;
    left: 80px;
    top: 50%;
    transform: translateY(-50%);
    max-width: 1040px;
  }
  .badge {
    display: inline-block;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #1A1A1A;
    opacity: 0.4;
    margin-bottom: 28px;
  }
  h1 {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    font-size: 72px;
    font-weight: 700;
    color: #1A1A1A;
    line-height: 1.05;
    letter-spacing: -2.5px;
    margin-bottom: 28px;
  }
  .subtitle {
    font-family: 'Instrument Sans', system-ui, sans-serif;
    font-size: 24px;
    color: #1A1A1A;
    opacity: 0.5;
    line-height: 1.5;
    max-width: 680px;
  }
  .stack {
    margin-top: 40px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stack span {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    letter-spacing: 1px;
    color: #1A1A1A;
    opacity: 0.3;
    padding: 6px 14px;
    border: 1px solid rgba(26, 26, 26, 0.15);
    border-radius: 100px;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Instrument+Sans:wght@400&family=Space+Mono&display=swap" rel="stylesheet" />
</head>
<body>
<div class="wrapper">
  <div class="content">
    <span class="badge">Angela AI</span>
    <h1>She Qualifies Your Leads<br/>While You Sleep</h1>
    <p class="subtitle">Conversational AI that scores, qualifies, and books meetings.<br/>No forms. No friction. Just pipeline.</p>
    <div class="stack">
      <span>React</span>
      <span>TypeScript</span>
      <span>Claude API</span>
      <span>Supabase</span>
      <span>Google Calendar</span>
    </div>
  </div>
</div>
</body>
</html>
